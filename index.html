    <script>
      // Compatibility shim for browser extensions attempting to assign window.fetch
      try {
        var origFetch = window.fetch ? window.fetch.bind(window) : null;
        var _activeFetch = origFetch;
        Object.defineProperty(window, 'fetch', {
          get: function() {
            return _activeFetch;
          },
          set: function(val) {
            _activeFetch = val;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (err) {
        // ignore
      }

      // Suppress browser extension runtime errors from triggering global error boundary
      window.addEventListener('error', function(e) {
        if (e && (
          (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) ||
          (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);

      window.addEventListener('unhandledrejection', function(e) {
        if (e && e.reason && (
          (e.reason.stack && (e.reason.stack.indexOf('chrome-extension://') !== -1 || e.reason.stack.indexOf('moz-extension://') !== -1)) ||
          (e.reason.message && e.reason.message.indexOf('Cannot set property fetch') !== -1)
        )) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
